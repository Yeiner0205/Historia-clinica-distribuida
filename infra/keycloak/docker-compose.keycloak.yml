# ============================================================================
# Complemento OPCIONAL: Keycloak como proveedor de identidad OAuth2/OIDC en
# lugar del JWT propio.
#
#   docker compose -f docker-compose.yml \
#                  -f infra/keycloak/docker-compose.keycloak.yml up -d
#
# SIN PROBAR. Ver infra/keycloak/LEEME.md.
# ============================================================================
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak_hc
    command: ["start-dev", "--import-realm"]
    ports: ["8180:8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg_central:5432/keycloak
      KC_DB_USERNAME: ${PG_USER:-admin}
      KC_DB_PASSWORD: ${PG_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-hc.json:/opt/keycloak/data/import/realm-hc.json:ro
    depends_on:
      pg_central:
        condition: service_healthy
    restart: unless-stopped
    networks: [red_hc]

  # La API y el bus pasarían a validar contra el realm en lugar de firmar
  # ellos mismos. Hace falta además el cambio en comun/seguridad.py que
  # describe el LEEME de esta carpeta.
  app:
    environment:
      OIDC_HABILITADO: "true"
      OIDC_ISSUER: http://keycloak:8080/realms/historia-clinica
      OIDC_JWKS: http://keycloak:8080/realms/historia-clinica/protocol/openid-connect/certs
      OIDC_AUDIENCIA: plataforma-hc

  hsb:
    environment:
      OIDC_HABILITADO: "true"
      OIDC_ISSUER: http://keycloak:8080/realms/historia-clinica
      OIDC_JWKS: http://keycloak:8080/realms/historia-clinica/protocol/openid-connect/certs
      OIDC_AUDIENCIA: plataforma-hc
