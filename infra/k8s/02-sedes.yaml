# Un StatefulSet por sede: cada nodo necesita volumen estable e identidad
# de red propia, por eso no es un Deployment.
---
apiVersion: v1
kind: Service
metadata:
  name: pg-nodo1
  namespace: historia-clinica
  labels: {sede: "1", nombre: "Sincelejo"}
spec:
  clusterIP: None
  selector: {app: pg-nodo1}
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-nodo1
  namespace: historia-clinica
spec:
  serviceName: pg-nodo1
  replicas: 1
  selector:
    matchLabels: {app: pg-nodo1}
  template:
    metadata:
      labels: {app: pg-nodo1, sede: "1"}
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: plataforma-secretos, key: PG_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: plataforma-secretos, key: PG_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: plataforma-config, key: PG_DB_SEDE}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: inicializacion
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "admin", "-d", "historia_clinica"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "admin"]}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 1Gi, cpu: 1000m}
      volumes:
        # Los scripts de inicialización vienen de un ConfigMap que se crea con:
        #   kubectl -n historia-clinica create configmap init-sede1 \
        #     --from-file=01_esquema.sql=db/sede/01_esquema.sql \
        #     --from-file=02_sede.sql=db/sede/02_sede1.sql \
        #     --from-file=03_datos.sql=db/sede/03_datos_sede1.sql
        - name: inicializacion
          configMap: {name: init-sede1}
  volumeClaimTemplates:
    - metadata: {name: datos}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 2Gi}}
---
