---
# Almacén central: cola del bus, auditoría, terminologías y base de HAPI.
# Vive fuera de las sedes a propósito: si una sede cae, el bus sigue.
apiVersion: v1
kind: Service
metadata:
  name: pg-central
  namespace: historia-clinica
spec:
  clusterIP: None
  selector: {app: pg-central}
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-central
  namespace: historia-clinica
spec:
  serviceName: pg-central
  replicas: 1
  selector:
    matchLabels: {app: pg-central}
  template:
    metadata:
      labels: {app: pg-central}
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: plataforma-secretos, key: PG_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: plataforma-secretos, key: PG_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: plataforma-config, key: PG_CENTRAL_DB}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: inicializacion
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "admin", "-d", "hsb"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 1Gi, cpu: 1000m}
      volumes:
        - name: inicializacion
          configMap: {name: init-central}
  volumeClaimTemplates:
    - metadata: {name: datos}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 4Gi}}
