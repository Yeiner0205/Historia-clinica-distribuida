apiVersion: v1
kind: Service
metadata:
  name: hsb
  namespace: historia-clinica
spec:
  selector: {app: hsb}
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsb
  namespace: historia-clinica
spec:
  # El bus escala horizontalmente: el estado vive en mensaje_bus y los
  # pendientes se reclaman con FOR UPDATE SKIP LOCKED, así que dos réplicas
  # no procesan el mismo mensaje.
  replicas: 2
  selector:
    matchLabels: {app: hsb}
  template:
    metadata:
      labels: {app: hsb}
    spec:
      containers:
        - name: hsb
          image: historia-clinica-distribuida-master-hsb:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "hsb.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: plataforma-config}
            - secretRef: {name: plataforma-secretos}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 512Mi, cpu: 1000m}
