apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: historia-clinica
spec:
  selector: {app: app}
  ports:
    - port: 8001
      targetPort: 8001
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: historia-clinica
spec:
  # La API es sin estado: escala con réplicas detrás del Service.
  replicas: 2
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
        - name: app
          image: historia-clinica-distribuida-master-app:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: {name: plataforma-config}
            - secretRef: {name: plataforma-secretos}
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 512Mi, cpu: 1000m}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plataforma
  namespace: historia-clinica
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: historia-clinica.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port: {number: 8001}
