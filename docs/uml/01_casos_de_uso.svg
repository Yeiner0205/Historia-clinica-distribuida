<text x="575" y="565" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#5b6b7a" text-anchor="middle">«include»</text>
<text x="24" y="742" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="start">«include»: enviar un mensaje al bus incluye normalizarlo a FHIR R4; generar el Reporte de HC incluye verificar la auditoría.</text>
