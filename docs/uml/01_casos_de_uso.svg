<text x="690" y="607" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11.5" font-weight="600" fill="#14202b" text-anchor="middle">Apagar o encender un nodo</text>
<text x="690" y="622" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" font-weight="400" fill="#5b6b7a" text-anchor="middle">prueba de resiliencia</text>
