<text x="24" y="34" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="19" font-weight="700" fill="#14202b">Casos de uso — Plataforma de interoperabilidad clínica</text>
<text x="24" y="54" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" font-weight="400" fill="#5b6b7a" text-anchor="start">Actores: paciente, admisionista, médico, auditor y el sistema legado de cada sede. 12 casos de uso.</text>
