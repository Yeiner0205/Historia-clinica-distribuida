<text x="690" y="162" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" font-weight="400" fill="#5b6b7a" text-anchor="middle">HL7 v2 / CSV legado</text>
<ellipse cx="690" cy="230" rx="108" ry="34" fill="#e7f6ee" stroke="#1f8a5c" stroke-width="1.5"/>
<text x="690" y="227" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11.5" font-weight="600" fill="#14202b" text-anchor="middle">Normalizar a FHIR R4</text>
<text x="690" y="242" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" font-weight="400" fill="#5b6b7a" text-anchor="middle">Patient/Encounter/Condition/Observation</text>
