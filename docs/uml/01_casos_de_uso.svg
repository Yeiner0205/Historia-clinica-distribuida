<text x="690" y="392" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" font-weight="400" fill="#5b6b7a" text-anchor="middle">mensajes por estado</text>
<ellipse cx="470" cy="530" rx="108" ry="34" fill="#fde9ef" stroke="#b5325c" stroke-width="1.5"/>
<text x="470" y="527" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11.5" font-weight="600" fill="#14202b" text-anchor="middle">Registrar diagnóstico CIE-10</text>
<text x="470" y="542" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" font-weight="400" fill="#5b6b7a" text-anchor="middle">ordenar, formular y egresar</text>
<ellipse cx="470" cy="610" rx="108" ry="34" fill="#fde9ef" stroke="#b5325c" stroke-width="1.5"/>
<text x="470" y="607" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11.5" font-weight="600" fill="#14202b" text-anchor="middle">Generar Reporte de HC</text>
<text x="470" y="622" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" font-weight="400" fill="#5b6b7a" text-anchor="middle">cobertura y sello de integridad</text>
<ellipse cx="690" cy="530" rx="108" ry="34" fill="#fff6d8" stroke="#a98300" stroke-width="1.5"/>
<text x="690" y="527" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11.5" font-weight="600" fill="#14202b" text-anchor="middle">Verificar la auditoría</text>
<text x="690" y="542" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" font-weight="400" fill="#5b6b7a" text-anchor="middle">cadena de hash</text>
